.loser {

}

}

.highlight strong {

}

  background: #0000aa;
  color: #ffff00;
  font-weight: bold;

  border-bottom: 1px solid #444;

.matchup .away {

.matchup .home {

.matchup .vs {

.matchup .team {

a {

/* CALCOLO CLASSIFICA */

function calculateStandings() {

  const standings = {};

  knownTeams.forEach(team => {
    standings[team] = {
      team,
      played:0,
      wins:0,
      losses:0,
      pointsFor:0,
      pointsAgainst:0
    };
  });

  results.forEach(g => {

    const away = standings[g.away];
    const home = standings[g.home];

    if (!away || !home) return;

    away.played++;
    home.played++;

    away.pointsFor += g.awayScore;
    away.pointsAgainst += g.homeScore;

    home.pointsFor += g.homeScore;
    home.pointsAgainst += g.awayScore;

    if (g.awayScore > g.homeScore) {
      away.wins++;
      home.losses++;
    } else {
      home.wins++;
      away.losses++;
    }

  });

  return Object.values(standings)
    .sort((a,b) =>
      b.wins-a.wins ||
      (b.pointsFor-b.pointsAgainst)-(a.pointsFor-a.pointsAgainst) ||
      b.pointsFor-a.pointsFor
    );
}

/* PAGINA 204 - RECORD */

function renderRecords() {

  const high = results
    .flatMap(g => [
      {team:g.away,score:g.awayScore,week:g.week},
      {team:g.home,score:g.homeScore,week:g.week}
    ])
    .sort((a,b) => b.score-a.score)[0];

  const low = results
    .flatMap(g => [
      {team:g.away,score:g.awayScore,week:g.week},
      {team:g.home,score:g.homeScore,week:g.week}
    ])
    .sort((a,b) => a.score-b.score)[0];

  const margins = results.map(g => ({
    diff:Math.abs(g.awayScore-g.homeScore),
    winner:g.awayScore > g.homeScore ? g.away : g.home,
    matchup:`${g.away} - ${g.home}`,
    week:g.week
  }));

  const margin = [...margins].sort((a,b) => b.diff-a.diff)[0];
  const close = [...margins].sort((a,b) => a.diff-b.diff)[0];

  return pageHeader("RECORD DELLA LEGA","204") +

    `<div class="panel">

      <div class="record-row">
        <span>Punteggio massimo</span>
        <span>${fmt(high.score)} · ${esc(high.team)}</span>
      </div>

      <div class="record-row">
        <span>Punteggio minimo</span>
        <span>${fmt(low.score)} · ${esc(low.team)}</span>
      </div>

      <div class="record-row">
        <span>Vittoria più larga</span>
        <span>+${fmt(margin.diff)} · ${esc(margin.winner)}</span>
      </div>

      <div class="record-row">
        <span>Incontro più equilibrato</span>
        <span>+${fmt(close.diff)} · ${esc(close.matchup)}</span>
      </div>

      <div class="record-row">
        <span>Partite registrate</span>
        <span>${results.length}</span>
      </div>

      <div class="record-row">
        <span>Giornate concluse</span>
        <span>${new Set(results.map(g => g.week)).size}</span>
      </div>

    </div>`;

}

/* PAGINA 205 - CALENDARIO */

function renderSchedule() {

  let content = "";
  const scheduleWeeks = [10, 11, 12];

  scheduleWeeks.forEach(week => {

    const games = upcoming.filter(g => g.week === week);
    if (!games.length) return;

    const date = games[0].date || "DATA DA DEFINIRE";

    content += `
      <div class="week-heading">
        GAME ${week} · ${date} · ${games.length} INCONTRI
      </div>`;

    games.forEach((g,i) => {

      content += `
        <div class="matchup">
          <div class="away">
            <span class="team">${esc(g.away)}</span>
            <span class="id">${esc(g.id || "")}</span>
          </div>
          <div class="vs">@</div>
          <div class="home">
            <span class="team">${esc(g.home)}</span>
          </div>
        </div>
        <div class="comment">
          ${esc((upcomingComments[week] || [])[i] || "Partita in programma.")}
        </div>`;

    });

  });

  return pageHeader("CALENDARIO","205") +
    `<div class="panel">
      <h2>◈ PROSSIME PARTITE</h2>
      ${content || '<div class="empty">Nessuna partita in programma.</div>'}
    </div>`;
}


/* FUNZIONI GENERALI */

function esc(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}


function showPage(page) {

  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle("active",button.dataset.page===page);
  });

  const pages = {
    "201":renderResults,
    "202":renderStandings,
    "203":renderHighlights,
    "204":renderRecords,
    "205":renderSchedule
  };

  document.getElementById("content").innerHTML =
    pages[page] ? pages[page]() : pages["201"]();

  const labels = {
    "201":"RISULTATI GAME 1–9",
    "202":"CLASSIFICA DOPO LA GAME 9",
    "203":"STATISTICHE E IN EVIDENZA",
    "204":"RECORD PROVVISORI",
    "205":"GARE 10–12 · IN PROGRAMMA"
  };

  document.getElementById("current-label").textContent =
    labels[page] || labels["201"];

  document.getElementById("ticker").textContent =
    page==="202"
      ? "CLASSIFICA AGGIORNATA AUTOMATICAMENTE DOPO LA GAME 9"
      : page==="205"
        ? "GAME 10: 11 NOVEMBRE · GAME 11: 14 NOVEMBRE · GAME 12: 16 NOVEMBRE"
        : "BGBIGREUNION — RISULTATI E STATISTICHE DELLA LEGA";

}


/* AVVIO */

document.querySelectorAll("nav button").forEach(button => {

  button.addEventListener("click",() => {
    showPage(button.dataset.page);
  });

});

document.getElementById("clock").textContent =
  `${leagueName} · STAGIONE 2026/27`;

showPage("201");

</script>
