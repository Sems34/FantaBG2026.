<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantabasket — BGBigReunion</title>

<style>
:root {
  --black:#000;
  --white:#f2f2f2;
  --yellow:#ffe900;
  --green:#00f000;
  --blue:#0000e8;
  --red:#e00000;
  --dim:#aaa;
}

* { box-sizing:border-box; }

body {
  margin:0;
  padding:16px;
  background:#090909;
  color:var(--white);
  font-family:"Courier New",Courier,monospace;
}

.tv {
  width:min(100%,900px);
  margin:0 auto;
  background:var(--black);
  min-height:85vh;
}

.topbar {
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 8px;
  min-height:42px;
  background:#8b0000;
  color:#fff;
  font-weight:bold;
}

.brand {
  color:#fff;
  font-size:clamp(.9rem,2.5vw,1.35rem);
  font-weight:900;
}

.clock { display:none; }

.subbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px;
  background:#000;
  color:var(--yellow);
  min-height:40px;
  flex-wrap:wrap;
}

nav {
  display:flex;
  flex-wrap:wrap;
  padding:0 0 8px;
  background:#000;
}

nav button {
  border:0;
  border-top:6px solid var(--blue);
  border-bottom:2px solid var(--blue);
  background:#000;
  color:var(--yellow);
  padding:7px 10px;
  cursor:pointer;
  font:bold .9rem "Courier New",monospace;
}

nav button:hover,
nav button.active {
  background:var(--blue);
  color:#fff;
}

main {
  padding:12px 14px 26px;
  min-height:390px;
  background:#000;
}

.page-title {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  color:var(--yellow);
  margin:0 0 16px;
}

h1 { font-size:1.2rem; margin:0; }

.notice {
  color:#ddd;
  font-size:.83rem;
  line-height:1.5;
}

.highlight { color:var(--yellow); }
.green { color:var(--green); }
.cyan { color:#48dfff; }
.red { color:#ff5555; }

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.panel {
  border-top:2px solid var(--blue);
  padding:12px 0;
  background:#000;
}

.panel h2 {
  font-size:.95rem;
  color:var(--yellow);
  margin:0 0 10px;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:clamp(.78rem,2vw,.98rem);
}

th {
  text-align:left;
  color:var(--yellow);
  border-bottom:2px solid var(--blue);
  padding:8px 5px;
}

td { padding:7px 5px; }

.winner {
  color:var(--green);
  font-weight:bold;
  text-transform:uppercase;
}

.loser {
  color:var(--white);
  text-transform:uppercase;
}

.score {
  color:var(--white);
  font-weight:bold;
  white-space:nowrap;
}

.tag {
  display:inline-block;
  color:var(--green);
  font-size:.72rem;
}

.ticker {
  color:#fff;
  background:var(--red);
  font-weight:bold;
  padding:10px 12px;
  overflow-wrap:anywhere;
}

.footer {
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  color:#aaa;
  background:#111;
  font-size:.72rem;
}

.record-row {
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:9px 0;
  border-bottom:1px dotted #333;
}

.record-row span:last-child {
  color:var(--yellow);
  text-align:right;
}

.comment {
  border-left:3px solid var(--blue);
  padding:8px 10px;
  margin:9px 0;
  background:#080808;
  font-size:.84rem;
  line-height:1.5;
}

.comment strong { color:var(--yellow); }

.week-heading {
  color:var(--yellow);
  border-bottom:2px solid var(--blue);
  padding:12px 0 7px;
  margin-top:18px;
  font-weight:bold;
}

.matchup-link {
  color:#48dfff;
  text-decoration:none;
  font-size:.75rem;
}

.matchup-link:hover {
  color:var(--yellow);
  text-decoration:underline;
}


@media(max-width:600px) {
  body { padding:0; }
  .tv { min-height:100vh; }
  .topbar { padding:4px; }
  .subbar { min-height:40px; }
  main { padding:10px 12px 24px; }
  nav button { padding:7px 6px; font-size:.78rem; }
  th,td { padding:7px 3px; }
}
</style>
</head>

/* CALCOLO CLASSIFICA */

function buildStandings() {

  const map = {};
  const byTeam = {};

  knownTeams.forEach(name => {
    map[name] = {
      name,
      w:0,
      l:0,
      pf:0,
      pa:0,
      streak:"—",
      diff:0
    };
  });

  results.forEach(g => {

    [
      [g.away,g.awayScore,g.home,g.homeScore],
      [g.home,g.homeScore,g.away,g.awayScore]
    ].forEach(([name,score,opp,oppScore]) => {

      if (!map[name]) {
        map[name] = {
          name,w:0,l:0,pf:0,pa:0,streak:"—",diff:0
        };
      }

      map[name].pf += score;
      map[name].pa += oppScore;

      const won = score > oppScore;

      if (won) map[name].w++;
      else if (score < oppScore) map[name].l++;

      if (!byTeam[name]) byTeam[name] = [];

      byTeam[name].push(
        won ? "W" : score === oppScore ? "T" : "L"
      );

    });

  });

  Object.values(map).forEach(t => {

    const games = byTeam[t.name] || [];

    if (games.length) {

      const last = games[games.length-1];
      let count = 0;

      for (
        let i=games.length-1;
        i>=0 && games[i]===last;
        i--
      ) {
        count++;
      }

      t.streak = last + count;
    }

    t.diff = t.pf - t.pa;

  });

  return Object.values(map).sort((a,b) =>
    b.w-a.w ||
    a.l-b.l ||
    b.pf-a.pf ||
    b.diff-a.diff ||
    a.name.localeCompare(b.name)
  );

}


function winner(g) {
  return g.awayScore > g.homeScore ? g.away : g.home;

          <td>
            <a class="matchup-link"
               href="${matchupUrl}"
               target="_blank">
              MATCHUP
            </a>
          </td>
        </tr>

        <tr>
          <td colspan="4">
            <div class="comment">
              ${esc(upcomingComments[week][i])}
            </div>
          </td>
        </tr>
      `;

    });

    content += `
          </tbody>
        </table>
      </div>
    `;

  });

  return pageHeader("PROSSIMI INCONTRI","205") +

    `<p class="notice">
      Calendario delle prossime partite.
      Seleziona MATCHUP per aprire la partita su Sports.ws.
    </p>

    ${content}

    <p class="notice">
      Le anticipazioni sono commenti editoriali basati sui risultati
      precedenti e non previsioni dei punteggi.
    </p>`;

}


/* GESTIONE PAGINE */

const pages = {
  "201":renderResults,
  "202":renderStandings,
  "203":renderHighlights,
  "204":renderRecords,
  "205":renderSchedule
};


function showPage(page) {

  document.getElementById("content").innerHTML =
    pages[page]();

  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page===page
    );
  });

  const labels = {
    "201":"RISULTATI GARE",
    "202":"CLASSIFICA",
    "203":"MOMENTI DELLA LEGA",
    "204":"RECORD PROVVISORI",
    "205":"GARE IN PROGRAMMA"
  };

  document.getElementById("current-label").textContent =
    labels[page];

  document.getElementById("ticker").textContent =
    page==="202"
      ? "CLASSIFICA AGGIORNATA AUTOMATICAMENTE"
      : page==="205"
        ? "GAME 6: 4 NOVEMBRE · GAME 7: 5 NOVEMBRE · GAME 8: 7 NOVEMBRE"
        : "BGBIGREUNION — RISULTATI E STATISTICHE DELLA LEGA";

}


/* AVVIO */

document.querySelectorAll("nav button").forEach(button => {

  button.addEventListener("click",() => {
    showPage(button.dataset.page);
  });

});

document.getElementById("clock").textContent =
  `${leagueName} · STAGIONE 2026/27`;

showPage("201");

</script>
</body>
</html>
