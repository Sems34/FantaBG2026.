<style>
:root {
  --black:#000;

* { box-sizing:border-box; }

body {
  margin:0;

.tv {

}

  display:flex;

  gap:8px;

  background:#8b0000;
  color:#fff;
  font-weight:bold;
}

.brand {

}

.clock { display:none; }

.subbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px;
  background:#000;
  color:var(--yellow);

}

nav {
  display:flex;
  flex-wrap:wrap;
  padding:0 0 8px;
  background:#000;
}

nav button {
  border:0;
  border-top:6px solid var(--blue);
  border-bottom:2px solid var(--blue);

  color:var(--yellow);
  padding:7px 10px;
  cursor:pointer;
  font:bold .9rem "Courier New",monospace;
}

nav button:hover,
nav button.active {
  background:var(--blue);
  color:#fff;
}

main {
  padding:12px 14px 26px;
  min-height:390px;
  background:#000;
}

.page-title {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  color:var(--yellow);
  margin:0 0 16px;
}

h1 { font-size:1.2rem; margin:0; }

.notice {
  color:#ddd;
  font-size:.83rem;
  line-height:1.5;
}

.highlight { color:var(--yellow); }
.green { color:var(--green); }
.cyan { color:#48dfff; }
.red { color:#ff5555; }

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.panel {
  border-top:2px solid var(--blue);
  padding:12px 0;
  background:#000;
}

.panel h2 {
  font-size:.95rem;
  color:var(--yellow);
  margin:0 0 10px;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:clamp(.78rem,2vw,.98rem);
}

th {
  text-align:left;
  color:var(--yellow);
  border-bottom:2px solid var(--blue);
  padding:8px 5px;
}

td { padding:7px 5px; }

.winner {
  color:var(--green);
  font-weight:bold;
  text-transform:uppercase;
}

.loser {
  color:var(--white);
  text-transform:uppercase;
}

.score {
  color:var(--white);
  font-weight:bold;
  white-space:nowrap;
}

.tag {
  display:inline-block;
  color:var(--green);
  font-size:.72rem;
}

.ticker {
  color:#fff;
  background:var(--red);
  font-weight:bold;
  padding:10px 12px;
  overflow-wrap:anywhere;
}

.footer {
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  color:#aaa;
  background:#111;
  font-size:.72rem;
}

.record-row {
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:9px 0;
  border-bottom:1px dotted #333;
}

.record-row span:last-child {
  color:var(--yellow);
  text-align:right;
}

.comment {
  border-left:3px solid var(--blue);
  padding:8px 10px;
  margin:9px 0;
  background:#080808;
  font-size:.84rem;
  line-height:1.5;
}

.comment strong { color:var(--yellow); }

.week-heading {
  color:var(--yellow);
  border-bottom:2px solid var(--blue);
  padding:12px 0 7px;
  margin-top:18px;
  font-weight:bold;
}

.matchup-link {
  color:#48dfff;
  text-decoration:none;
  font-size:.75rem;
}

.matchup-link:hover {
  color:var(--yellow);
  text-decoration:underline;
}

@media(max-width:600px) {

const knownTeams = [
  "Gradisca","Semsonite","giordi","Ufficio","Paerfetto","Miami",
  "rualis","Monty","Detroit","Wisp","VaSulMus","Coca",
  "Golden State","Portland"
];

const fmt = n => Number(n).toFixed(1);

const esc = s => String(s).replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));


/* CALCOLO CLASSIFICA */

function buildStandings() {

  const map = {};
  const byTeam = {};

  knownTeams.forEach(name => {
    map[name] = {
      name,
      w:0,
      l:0,
      pf:0,
      pa:0,
      streak:"—",
      diff:0
    };
  });

  results.forEach(g => {

    [
      [g.away,g.awayScore,g.home,g.homeScore],
      [g.home,g.homeScore,g.away,g.awayScore]
    ].forEach(([name,score,opp,oppScore]) => {

      if (!map[name]) {
        map[name] = {
          name,w:0,l:0,pf:0,pa:0,streak:"—",diff:0
        };
      }

      map[name].pf += score;
      map[name].pa += oppScore;

      const won = score > oppScore;

      if (won) map[name].w++;
      else if (score < oppScore) map[name].l++;

      if (!byTeam[name]) byTeam[name] = [];

      byTeam[name].push(
        won ? "W" : score === oppScore ? "T" : "L"
      );

    });

  });

  Object.values(map).forEach(t => {

    const games = byTeam[t.name] || [];

    if (games.length) {

      const last = games[games.length-1];
      let count = 0;

      for (
        let i=games.length-1;
        i>=0 && games[i]===last;
        i--
      ) {
        count++;
      }

      t.streak = last + count;
    }

    t.diff = t.pf - t.pa;

  });

  return Object.values(map).sort((a,b) =>
    b.w-a.w ||
    a.l-b.l ||
    b.pf-a.pf ||
    b.diff-a.diff ||
    a.name.localeCompare(b.name)
  );

}


function winner(g) {
  return g.awayScore > g.homeScore ? g.away : g.home;
}

function renderStandings() {

  const rows = standings.map((t,i) => `

      <td>${esc(t.name)}</td>
      <td class="num">${t.w}-${t.l}</td>
      <td class="num">${fmt(t.pf)}</td>
      <td class="num">${fmt(t.pa)}</td>
      <td class="num ${t.diff>=0?'green':'red'}">
        ${t.diff>0?'+':''}${fmt(t.diff)}

  `).join("");

  return pageHeader("CLASSIFICA GENERALE","202") +

    `<p class="notice">

/* PAGINA 203 - IN EVIDENZA */

function renderHighlights() {

  const biggest = [...results].sort((a,b) =>
    Math.abs(b.awayScore-b.homeScore) -
    Math.abs(a.awayScore-a.homeScore)
  )[0];

  const allScores = results.flatMap(g => [
    {team:g.away,score:g.awayScore},
    {team:g.home,score:g.homeScore}
  ]).sort((a,b) => b.score-a.score);

  const high = allScores[0];
  const low = allScores[allScores.length-1];

  const wins = results.filter(
    g => g.awayScore!==g.homeScore
  ).length;

  const game13Best = [...results]
    .filter(g => g.week===13)
    .flatMap(g => [
      {team:g.away,score:g.awayScore},
      {team:g.home,score:g.homeScore}
    ])
    .sort((a,b) => b.score-a.score)[0];

  return pageHeader("IN EVIDENZA","203") +

    `<div class="grid">

      <section class="panel">
        <h2>◈ MIGLIOR PUNTEGGIO</h2>
        <div class="highlight" style="font-size:1.45rem">
          ${fmt(high.score)}
        </div>
        <p class="green">${esc(high.team)}</p>
        <p class="notice">
          Miglior punteggio registrato nelle giornate concluse.
        </p>
      </section>

      <section class="panel">
        <h2>◈ PUNTEGGIO PIÙ BASSO</h2>
        <div class="highlight" style="font-size:1.45rem">
          ${fmt(low.score)}
        </div>
        <p>${esc(low.team)}</p>
        <p class="notice">
          Punteggio più basso registrato nelle giornate concluse.
        </p>
      </section>

      <section class="panel">
        <h2>◈ VITTORIA PIÙ LARGA</h2>
        <div class="highlight" style="font-size:1.45rem">
          +${fmt(Math.abs(biggest.awayScore-biggest.homeScore))}
        </div>
        <p class="green">${esc(winner(biggest))}</p>
        <p class="notice">
          ${esc(biggest.away)} ${fmt(biggest.awayScore)}
          – ${fmt(biggest.homeScore)} ${esc(biggest.home)}
        </p>
      </section>

      <section class="panel">
        <h2>◈ INCONTRI CON VINCITORE</h2>
        <div class="highlight" style="font-size:1.45rem">
          ${wins} / ${results.length}
        </div>
        <p class="notice">
          Statistiche aggiornate dai risultati inseriti.
        </p>
      </section>

      <section class="panel">
        <h2>◈ MIGLIOR PUNTEGGIO GAME 13</h2>
        <div class="highlight" style="font-size:1.45rem">
          ${fmt(game13Best.score)}
        </div>
        <p class="green">${esc(game13Best.team)}</p>
        <p class="notice">
          Il miglior risultato individuale della Game 13.
        </p>
      </section>

    </div>`;

}


/* PAGINA 204 - RECORD */

function renderRecords() {

  const all = results.flatMap(g => [
    {
      team:g.away,
      score:g.awayScore,
      opponent:g.home,
      week:g.week
    },
    {
      team:g.home,
      score:g.homeScore,
      opponent:g.away,
      week:g.week
    }
  ]);

  const high = [...all].sort((a,b)=>b.score-a.score)[0];
  const low = [...all].sort((a,b)=>a.score-b.score)[0];

  const margin = [...results].map(g => ({
    winner:winner(g),
    diff:Math.abs(g.awayScore-g.homeScore),
    matchup:`${g.away} – ${g.home}`
  })).sort((a,b)=>b.diff-a.diff)[0];

  const close = [...results].map(g => ({
    winner:winner(g),
    diff:Math.abs(g.awayScore-g.homeScore),
    matchup:`${g.away} – ${g.home}`
  })).sort((a,b)=>a.diff-b.diff)[0];

  return pageHeader("RECORD DELLA LEGA","204") +

    `<div class="panel">

      <div class="record-row">
        <span>Punteggio massimo</span>
        <span>${fmt(high.score)} · ${esc(high.team)}</span>
      </div>

      <div class="record-row">
        <span>Punteggio minimo</span>
        <span>${fmt(low.score)} · ${esc(low.team)}</span>
      </div>

      <div class="record-row">
        <span>Vittoria più larga</span>
        <span>+${fmt(margin.diff)} · ${esc(margin.winner)}</span>
      </div>

      <div class="record-row">
        <span>Incontro più equilibrato</span>
        <span>+${fmt(close.diff)} · ${esc(close.matchup)}</span>
      </div>

      <div class="record-row">
        <span>Partite registrate</span>
        <span>${results.length}</span>
      </div>

      <div class="record-row">
        <span>Giornate concluse</span>
        <span>${new Set(results.map(g => g.week)).size}</span>
      </div>

    </div>`;

}
